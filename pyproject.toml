[project]
name = "testing-ai-systems-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cairosvg>=2.8.2",
    "matplotlib>=3.10.3",
    "pillow>=11.3.0",
    "pypotrace>=0.3",
    "scipy>=1.16.0",
    "svgelements>=1.9.6",
    "torch>=2.10.0",
    "torchvision>0.22.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
